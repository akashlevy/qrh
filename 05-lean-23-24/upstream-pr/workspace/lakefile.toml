# Build workspace for the akashlevy/math fork: compiles the QRH-family modules of ../math/lean
# (the 7/8 and 23/24 proofs and their shared infrastructure) against the Mathlib checkout of the
# parent workspace, without pulling the dependencies of the rest of the upstream library.
name = "upstream_qrh"
version = "0.1.0"
defaultTargets = ["OAI", "ComparatorChallenges"]
packagesDir = "../.lake/packages"

[leanOptions]
autoImplicit = false

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "c39a751132c88b6e8080b74c74023fd95b3d8be0"

[[require]]
name = "rellich-kondrachov"
git = "https://github.com/abenenson/rellich-kondrachov.git"
rev = "70f85d4c1bf99c6e7d61e8be4daa6f3664d08d23"

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "468e8f58fb4ad6e6ad672a08da6d0d0531e95a97"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert.git"
rev = "7f91b6eb3567437f6cfac03ed279706603ee22f4"

[[require]]
name = "PrimeCert"
git = "https://github.com/b-mehta/PrimeCert.git"
rev = "0803c2f6bd289c09704c7d352bb8fcf770cbb9b2"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "OAI"
srcDir = "../math/lean"
roots = ["OAI.NumberTheory.DirichletL.Nonvanishing", "OAI.NumberTheory.DirichletL.Hecke.Nonvanishing",
         "OAI.NumberTheory.DirichletL.QRH", "OAI.NumberTheory.DirichletL.CubicDyadicDecay"]
globs = ["OAI.NumberTheory.DirichletL.+"]

[[lean_lib]]
name = "ComparatorChallenges"
srcDir = "../math/lean"
roots = ["ComparatorChallenges.QuasiRiemannHypothesis", "ComparatorChallenges.DirichletSevenEighths",
         "ComparatorChallenges.HeckeSevenEighths", "ComparatorChallenges.QuasiRiemannTwentyThreeTwentyFourths",
         "ComparatorChallenges.DirichletTwentyThreeTwentyFourths"]
